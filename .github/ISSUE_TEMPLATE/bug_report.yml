name: Bug report
description: Report a reproducible issue with Vortex Spiral.
title: "Bug: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Android TV model, OS version, and API level
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the selected vortex settings and what happened.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
