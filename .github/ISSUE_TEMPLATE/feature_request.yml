name: Feature request
description: Suggest a screensaver option or improvement.
title: "Feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What should improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Describe the change
      description: Explain the visual result and any setting you expect to control it.
    validations:
      required: true
