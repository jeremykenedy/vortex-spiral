name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build, tests, and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Run host tests
        run: bash test.sh
      - name: Enforce installer line and branch coverage
        run: bash scripts/test-python-coverage.sh
      - name: Enforce Java line and branch coverage
        run: bash scripts/test-coverage.sh
      - name: Build and validate APK
        run: |
          bash build.sh
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions build/vortex-spiral.apk
          if "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions build/vortex-spiral.apk | grep -q android.permission.INTERNET; then
            echo 'The screensaver must not request network access.' >&2
            exit 1
          fi
